image: nixos/unstable
arch: x86_64
oauth: git.sr.ht/OBJECTS:RW builds.sr.ht/JOBS:RW
environment:
  NIX_CONFIG: "experimental-features = nix-command flakes"
sources:
  - https://git.sr.ht/~averagechris/workctl
tasks:
  - release-artifact: |
      cd workctl
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
  - upload-and-refresh: |
      cd workctl
      hut() { nix shell nixpkgs#hut --command hut "$@"; }
      version="$(awk '/^\[workspace\.package\]/{s=1} s && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
      tag="v${version#v}"
      commit="$(git rev-parse HEAD)"

      mkdir -p ~/.config/hut
      token="$(cat ~/.oauth-token)"
      cat > ~/.config/hut/config <<EOF
      instance "sr.ht" {
          access-token "$token"
      }
      EOF

      for artifact in result-release-artifact/*.tar.gz; do
        hut git artifact upload -r workctl --rev "$tag" "$artifact" "$artifact.sha256"
      done

      manifest="$(mktemp)"
      cat > "$manifest" <<EOF
      image: nixos/unstable
      arch: x86_64
      oauth: pages.sr.ht/PAGES:RW
      environment:
        NIX_CONFIG: "experimental-features = nix-command flakes"
        TRIGGER_SOURCE: release
        TRIGGER_PROJECT: workctl
        TRIGGER_TAG: $tag
        TRIGGER_SHA: $commit
      sources:
        - https://git.sr.ht/~averagechris/averagechris.srht.site
      tasks:
        - refresh: |
            cd averagechris.srht.site
            nix run .#refresh-pages
      EOF
      hut builds submit "$manifest" --note "site refresh: workctl $tag" --visibility unlisted
artifacts:
  - artifacts/workctl-v0.1.1-x86_64-linux.tar.gz
  - artifacts/workctl-v0.1.1-x86_64-linux.tar.gz.sha256
