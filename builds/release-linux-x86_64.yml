image: nixos/unstable
arch: x86_64
oauth: git.sr.ht/OBJECTS:RW git.sr.ht/REPOSITORIES:RO git.sr.ht/PROFILE:RO builds.sr.ht/JOBS:RW builds.sr.ht/SECRETS:RO meta.sr.ht/PROFILE:RO
environment:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.userAgent
  GIT_CONFIG_VALUE_0: "averagechris-fleet-pages (+https://averagechris.srht.site)"
  NIX_CONFIG: |
    experimental-features = nix-command flakes
    extra-substituters = https://averagechris-dotfiles.cachix.org
    extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
sources:
  - https://git.sr.ht/~averagechris/workctl
tasks:
  - release-artifact: |
      set -eu
      cd workctl
      nix build .#release-artifact --out-link result-release-artifact
      mkdir -p ~/artifacts
      cp -p result-release-artifact/* ~/artifacts/
  - upload-and-refresh: |
      set -eu
      cd workctl
      srht() { nix run 'git+https://git.sr.ht/~averagechris/srht' -- "$@"; }
      # Jobs with an oauth grant get ~/.config/hut/config pre-provisioned;
      # srht reads SRHT_TOKEN, so extract that token unless already provided.
      export SRHT_TOKEN="${SRHT_TOKEN:-${OAUTH2_TOKEN:-$(awk '/access-token/ { gsub(/"/, "", $2); print $2; exit }' ~/.config/hut/config 2>/dev/null || true)}}"
      version="$(awk '/^\[workspace\.package\]/{s=1} s && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
      tag="v${version#v}"
      commit="$(git rev-parse HEAD)"

      set -- result-release-artifact/*.tar.gz
      [ -e "$1" ] || { printf '%s\n' 'no release artifacts found' >&2; exit 1; }
      for artifact do
        srht git artifact upload -r workctl --rev "$tag" "$artifact"
        srht git artifact upload -r workctl --rev "$tag" "$artifact.sha256"
      done

      manifest="$(mktemp)"
      cat > "$manifest" <<EOF
      image: nixos/unstable
      arch: x86_64
      oauth: pages.sr.ht/PAGES:RW
      environment:
        GIT_CONFIG_COUNT: "1"
        GIT_CONFIG_KEY_0: http.userAgent
        GIT_CONFIG_VALUE_0: "averagechris-fleet-pages (+https://averagechris.srht.site)"
        NIX_CONFIG: |
          experimental-features = nix-command flakes
          extra-substituters = https://averagechris-dotfiles.cachix.org
          extra-trusted-public-keys = averagechris-dotfiles.cachix.org-1:VwJkl5dG1+xGDY5x884mH/kVwwpgwBAdBKIF3BZiia4=
        TRIGGER_SOURCE: release
        TRIGGER_PROJECT: workctl
        TRIGGER_TAG: $tag
        TRIGGER_SHA: $commit
      sources:
        - https://git.sr.ht/~averagechris/averagechris.srht.site
      tasks:
        - refresh: |
            cd averagechris.srht.site
            nix run .#refresh-pages
      EOF
      srht builds submit "$manifest" --secrets --note "site refresh: workctl $tag"
artifacts:
  - artifacts/workctl-v0.1.1-x86_64-linux.tar.gz
  - artifacts/workctl-v0.1.1-x86_64-linux.tar.gz.sha256
